name: Unpack cloud support
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack cloud-support.zip into the repo root
        run: |
          set -euo pipefail
          Z=$(find . -maxdepth 2 -type f -iname 'cloud-support*.zip' -not -path './.git/*' | head -1)
          if [ -z "$Z" ]; then echo "::error::cloud-support.zip not found in the repo"; exit 1; fi
          unzip -q -o "$Z" -d . -x '__MACOSX/*' '.github/workflows/*'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools
          if git diff --cached --quiet; then echo "Already up to date"; else
            git commit -m "Add tools/cloud from cloud-support.zip"
            git push
          fi

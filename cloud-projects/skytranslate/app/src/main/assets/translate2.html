<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="ai-keys.js"></script>
<script src="native-speech.js"></script>
<link rel="preconnect" href="https://gen.pollinations.ai" crossorigin>
<link rel="preconnect" href="https://api.tavily.com" crossorigin>
<link rel="dns-prefetch" href="https://api.mymemory.translated.net">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Translate</title>
<style>
:root{--top:#fff;--bot:#EFF2F8;--card:#fff;--ink:#1f1f1f;--mut:#5f6368;--tc:#C2E7FF;--ontc:#004A77;--pri:#0B57D0;--onpri:#fff;--sel:#C2E7FF;--ln:#d3d7de;--err:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--top:#1b1b1f;--bot:#111318;--card:#2a2b30;--ink:#e3e3e3;--mut:#9aa0a6;--tc:#004A77;--ontc:#C2E7FF;--pri:#A8C7FA;--onpri:#062E6F;--sel:#004A77;--ln:#3c3e44;--err:#F2B8B5;color-scheme:dark}}
:root[data-theme="dark"]{--top:#1b1b1f;--bot:#111318;--card:#2a2b30;--ink:#e3e3e3;--mut:#9aa0a6;--tc:#004A77;--ontc:#C2E7FF;--pri:#A8C7FA;--onpri:#062E6F;--sel:#004A77;--ln:#3c3e44;--err:#F2B8B5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;font-family:"Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bot);color:var(--ink);display:flex;justify-content:center;height:100%}
#app{width:100%;max-width:480px;height:100%;background:var(--bot);position:relative;overflow:hidden}
svg{width:24px;height:24px;fill:currentColor;display:block}
button{cursor:pointer;border:0;background:none;color:inherit}
#home,#sub{position:absolute;inset:0;display:flex;flex-direction:column}
#sub{display:none;background:var(--bot)}
.top{flex:1;background:var(--top);border-radius:0 0 32px 32px;padding:10px 20px 12px;display:flex;flex-direction:column;overflow-y:auto}
.hd{display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.hd h1{text-align:center;font-size:18px;font-weight:400}
.hd h1 b{font-weight:600}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
@media (hover:hover){.ib:hover{background:var(--bot)}}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0B57D0,#8E5BFF);color:#fff;display:grid;place-items:center;justify-self:end}
.av svg{width:22px;height:22px}
.adv{align-self:center;height:34px;padding:0 20px;border-radius:17px;background:var(--bot);font-size:14px;font-weight:500;margin-top:4px}
.inw{display:flex;align-items:flex-start;gap:8px;margin-top:26px}
textarea{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:24px;line-height:1.3;resize:none;height:40px;max-height:200px}
textarea::placeholder{color:var(--mut)}
.pen{margin-top:4px}
.paste{align-self:flex-start;margin-top:20px;height:40px;padding:0 20px 0 16px;border-radius:20px;background:var(--tc);color:var(--ontc);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.res{display:none;margin-top:16px;border-top:1px solid var(--ln);padding-top:16px}
.res.on{display:block}
.res p{font-size:20px;line-height:1.3;color:var(--pri)}
.ra{display:flex;gap:4px;margin-top:8px}
.ra .ib{color:var(--mut)}
.hdl{width:60px;height:5px;border-radius:3px;background:var(--ln);align-self:center;margin-top:auto;flex:none}
.res+.hdl,.paste+.hdl{margin-top:auto}
.bot{padding:18px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.lg{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center}
.lb{height:52px;border-radius:20px;background:var(--card);font-size:15px;font-weight:500}
.sw{justify-self:center;color:var(--ink)}
.ac{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;margin-top:22px}
.sm{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.sm i{width:52px;height:52px;border-radius:50%;background:var(--tc);color:var(--ontc);display:grid;place-items:center}
.mic{width:92px;height:92px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;margin:0 auto 18px}
.mic svg{width:34px;height:34px}
.mic.rec{animation:pl 1.2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #0b57d066}70%{box-shadow:0 0 0 20px #0b57d000}100%{box-shadow:0 0 0 0 #0b57d000}}
.sh{display:flex;align-items:center;gap:4px;height:64px;padding:0 8px}
.sh h2{font-size:18px;font-weight:400}
.pg{display:none;flex:1;overflow-y:auto;padding:4px 16px 16px;flex-direction:column}
.pg.on{display:flex}
.list{background:var(--card);border-radius:28px;overflow:hidden;margin-bottom:16px}
.li{display:flex;align-items:center;gap:16px;padding:14px 22px;min-height:56px;width:100%;text-align:left;font-size:15px}
.li .t{flex:1}
.li small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.li>svg,.li>span>svg{color:var(--mut)}
.lbl{font-size:12px;font-weight:500;color:var(--pri);padding:8px 22px}
.tgl{width:52px;height:32px;border-radius:16px;border:2px solid var(--mut);position:relative;flex:none}
.tgl::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.15s}
.tgl.on{background:var(--pri);border-color:var(--pri)}
.tgl.on::after{left:24px;top:2px;width:24px;height:24px;background:var(--onpri)}
.card{background:var(--card);border-radius:20px;padding:16px 20px;margin-bottom:12px}
.card .b{color:var(--pri);font-size:16px;margin-top:4px}
.card small{color:var(--mut);font-size:12px;display:block;margin-top:6px}
.empty{color:var(--mut);text-align:center;margin-top:60px;font-size:13px}
.big{width:96px;height:96px;border-radius:50%;background:var(--tc);color:var(--ontc);display:grid;place-items:center;margin:30px auto 10px}
.big svg{width:40px;height:40px}
.big.rec{background:var(--pri);color:var(--onpri);animation:pl 1.2s infinite}
.bub{padding:12px 16px;border-radius:20px;margin:6px 0;max-width:80%;font-size:14px}
.me{background:var(--card);border-bottom-left-radius:6px}
.them{background:var(--pri);color:var(--onpri);margin-left:auto;border-bottom-right-radius:6px}
.vf{flex:1;border-radius:28px;background:linear-gradient(160deg,#3a3550,#17151f);display:grid;place-items:center;color:#fff;min-height:300px}
.vf div.d{border:2px dashed #fff8;border-radius:16px;padding:20px 26px;text-align:center}
.shut{width:72px;height:72px;border-radius:50%;border:4px solid var(--pri);background:var(--tc);margin:16px auto 4px}
#sheet{position:absolute;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#sheet.on{display:flex}
.box{background:var(--bot);width:100%;border-radius:28px 28px 0 0;padding:26px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.box h3{font-size:18px;font-weight:500;margin-bottom:16px}
.mo{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 20px;border-radius:20px;background:var(--card);margin-bottom:8px;font-size:16px}
.mo.s{background:var(--sel)}
.mo small{display:block;font-size:13px;margin-top:4px}
.info{display:flex;gap:18px;align-items:center;border-top:1px solid var(--ln);margin:18px -20px 0;padding:16px 24px 0;font-size:13px;color:var(--mut)}
.info svg{flex:none}

*{-webkit-tap-highlight-color:transparent}
button{outline:none;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .15s,background-color .2s,opacity .2s}
button:focus,button:focus-visible{outline:none}
button:active{transform:scale(.95)}
.rp{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:rp .55s ease-out forwards}
@keyframes rp{0%{transform:scale(0);opacity:.2}100%{transform:scale(1);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes popin{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes popt{50%{transform:scale(1.1)}}
@keyframes scan{0%,100%{top:12%}50%{top:82%}}
.pop{animation:popt .3s}
#home{animation:fade .3s backwards}
.top>*{animation:up .5s cubic-bezier(.2,.8,.2,1) backwards}
.top>*:nth-child(2){animation-delay:.05s}.top>*:nth-child(3){animation-delay:.1s}.top>*:nth-child(4){animation-delay:.15s}.top>*:nth-child(5){animation-delay:.2s}
.bot{animation:up .5s .1s cubic-bezier(.2,.8,.2,1) backwards}
.ac>.sm:first-child{animation:up .5s .2s backwards}
.ac>.sm:last-child{animation:up .5s .3s backwards}
.mic{animation:popin .55s .22s backwards}
.sh{animation:fade .3s backwards}
.pg.on{animation:slide .3s cubic-bezier(.2,.8,.2,1) backwards}
.res.on{animation:up .35s backwards}
#sheet.on{animation:fade .2s}
#sheet.on .box{animation:sheetup .3s cubic-bezier(.2,.8,.2,1)}
.list,.card,.mo{animation:up .4s backwards}
.lbl{animation:fade .4s backwards}
.list:nth-of-type(2),.card:nth-child(2),.mo:nth-child(3){animation-delay:.06s}
.card:nth-child(3),.mo:nth-child(4){animation-delay:.12s}
.card:nth-child(4){animation-delay:.18s}
.bub{animation:popin .3s backwards}
.big{animation:popin .5s backwards}
.shut{animation:popin .5s .1s backwards}
.vf{position:relative;overflow:hidden}
.vf::after{content:"";position:absolute;left:8%;right:8%;top:12%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#a8c7fa,transparent);animation:scan 2.4s ease-in-out infinite}
.sw svg{transition:transform .35s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.sw{border-radius:50%}
.sw:active{background:#8a8f9955}
.sw.swp{animation:swg .8s ease-out}
@keyframes swg{0%{background:#8a8f9955}35%{background:#8a8f9944}100%{background:#8a8f9900}}
.srch{border:0;outline:0;background:var(--card);color:var(--ink);border-radius:26px;height:48px;padding:0 20px;font-size:16px;margin:0 0 10px;width:100%;flex:none}
.lr{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:15px 22px;font-size:15px;animation:up .35s backwards}
.lr.s{background:var(--sel);color:var(--ontc)}
.ck{animation:popin .35s backwards}

.lr small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.lr.s small{color:var(--ontc)}
.lr .t{flex:1;font-size:15px}
.lr.o{padding:6px 12px 6px 22px;cursor:default}
.ob{color:var(--pri)}
.ob.done{background:var(--tc);color:var(--ontc)}
.ob.done svg{animation:popin .35s backwards}
.ib .rg{width:30px;height:30px;transform:rotate(-90deg)}
.rb{fill:none;stroke:var(--ln);stroke-width:3}
.rf{fill:none;stroke:var(--pri);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .15s linear}

.bt{font-size:28px;font-weight:400;padding:2px 8px 10px;animation:up .4s backwards}
.lbl2{font-size:13px;font-weight:500;color:var(--pri);padding:22px 20px 6px;animation:fade .4s backwards}
.lr{position:relative;overflow:hidden;padding:8px 12px 8px 20px;min-height:54px;cursor:pointer}
.lr.s{border-radius:28px}
.lc{display:flex}
.lc svg{width:22px;height:22px;margin-right:14px;animation:popin .35s backwards}
.pk{width:40px;height:40px}
.rs{fill:var(--pri)}

.na .lr,.na .lbl2,.na .lc svg{animation:none}
.lr{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#cmo{position:absolute;inset:0;z-index:15;display:none}
#cmo.on{display:block}
#cm{position:absolute;width:190px;background:var(--card);border-radius:16px;padding:8px 0;box-shadow:0 6px 24px #0004;border:1px solid var(--ln);animation:popin .2s backwards;transform-origin:top left}
#cm button{display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 18px;font-size:15px;text-align:left}
#cm button:disabled{opacity:.4}
#cm svg{width:20px;height:20px;color:var(--mut)}
#dg{position:absolute;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
#dg.on{display:flex;animation:fade .2s}
.dgb{width:100%;max-width:340px;background:var(--bot);border:1px solid var(--ln);border-radius:28px;padding:24px 24px 14px;box-shadow:0 8px 28px #0006;animation:popin .25s backwards}
.dgb h4{font-size:20px;font-weight:400;line-height:1.4;margin-bottom:26px}
.dga{display:flex;justify-content:flex-end;gap:8px}
.dga button{height:40px;padding:0 16px;border-radius:20px;color:var(--pri);font-size:15px;font-weight:500}

/* ---- Live translate ---- */
#lvS,#lvR{position:absolute;inset:0;z-index:8;display:none;flex-direction:column}
#lvS.on,#lvR.on{display:flex}
#lvS{background:var(--top);border-radius:28px 28px 0 0;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));animation:sheetup .3s cubic-bezier(.2,.8,.2,1)}
#lvR{background:var(--bot);animation:fade .25s}
.lvx{align-self:flex-end}
.lvh{text-align:center;font-size:20px;font-weight:400;margin:0 0 18px}
.lvlg{display:grid;grid-template-columns:1fr 48px 1fr;align-items:start;gap:4px;flex:none}
.lvlg>div{display:flex;flex-direction:column;align-items:center;gap:10px}
.lvb{width:100%;height:46px;border-radius:23px;background:var(--bot);font-size:14px;font-weight:500}
.lvt{display:flex;align-items:center;gap:6px;font-size:12px}
.lvt svg{width:17px;height:17px}
.lvlg .sw{margin-top:3px}
.lvil{margin:18px 0 14px;border-radius:28px;background:var(--bot);height:190px;overflow:hidden;flex:none}
.lvil img{width:100%;height:100%;display:block;object-fit:contain;object-position:center bottom;padding-top:10px}
.lvo{display:flex;flex-direction:column;gap:8px}
.lvc{display:flex;align-items:flex-start;gap:14px;padding:12px 18px;background:var(--bot);text-align:left;width:100%;border-radius:4px;font-size:15px}
.lvc:first-child{border-radius:28px 28px 4px 4px}
.lvc:last-child{border-radius:4px 4px 28px 28px}
.lvc.s{background:var(--sel);color:var(--ontc)}
.lvc.d{opacity:.5;pointer-events:none}
.lvc>svg{flex:none;margin-top:2px}
.lvc .x{flex:1}
.lvc small{display:block;font-size:12.5px;opacity:.85;margin-top:2px;line-height:1.3}
.lvgo{margin-top:auto;height:52px;border-radius:26px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;flex:none}
.lvst{flex:1;min-height:0;background:var(--top);border-radius:0 0 32px 32px;display:flex;flex-direction:column}
.lvtb{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:10px 12px 6px;flex:none}
.lvpl{justify-self:center;display:flex;align-items:center;background:var(--bot);border-radius:26px;height:46px;padding:0 6px}
.lvpl>button:not(.ib){padding:0 14px;height:40px;font-size:15px;border-radius:20px;color:var(--mut)}
.lvpl>button.a{color:var(--ink);font-weight:600}
.lvpl .ib{width:36px;height:36px}
.lvls{flex:1;overflow-y:auto;padding:0 20px 20px;display:flex;flex-direction:column}
.lvls>:first-child{margin-top:auto}
.lve{padding:14px 0 8px;animation:up .35s backwards}
.lvh2{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500}
.lvh2 svg{width:20px;height:20px}
.lvh2 .sp{flex:1}
.lvh2 .ib{width:44px;height:44px;background:var(--bot)}
.lvs1{font-size:28px;color:var(--mut);padding:12px 0 14px;line-height:1.25;word-break:break-word}
.lvs1.ln{border-bottom:1px solid var(--ln)}
.lvs2{font-size:34px;padding-top:12px;line-height:1.3;word-break:break-word}
.lve.c .lvs1,.lve.c .lvs2{display:none}
.lve.c .cv svg{transform:rotate(180deg)}
.lvbt{flex:none;position:relative;padding:34px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:16px}
.lvbt::before{content:"";position:absolute;top:0;left:10%;right:10%;height:56px;background:radial-gradient(ellipse at top,#7fd8ff77,#4b7bec22 55%,transparent 75%);pointer-events:none}
.lvbt::after{content:"";position:absolute;top:0;left:18%;right:18%;height:2px;background:linear-gradient(90deg,transparent,#59c8f5,#4b7bec,transparent)}
.lvsts{font-size:18px;position:relative;min-height:24px;text-align:center}
.lvct{display:flex;gap:12px;align-items:center;position:relative}
.lvmd{height:56px;padding:0 30px;border-radius:28px;background:var(--card);display:flex;align-items:center;gap:12px;font-size:18px;font-weight:500}
.lvpz{width:100px;height:56px;border-radius:28px;background:#DC362E;color:#fff;display:grid;place-items:center}
.lvpz.off{background:var(--pri);color:var(--onpri)}

/* ---- Voice (mic) screen ---- */
#vs{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;background:var(--bot)}
#vs.on{display:flex;animation:fade .2s}
.vtop{flex:1;min-height:0;background:var(--top);border-radius:0 0 32px 32px;display:flex;flex-direction:column;padding:10px 14px 22px;overflow-y:auto}
.vbar{display:flex;align-items:center;min-height:48px;flex:none}
.vbar .sp{flex:1}
.vbar .ib{color:var(--ink)}
.vph{font-size:38px;line-height:1.2;color:var(--mut);padding:0 8px;margin-top:70px;word-break:break-word}
.vph.hv{color:var(--ink)}
.vtr{align-self:center;margin-top:auto;height:50px;padding:0 26px 0 20px;border-radius:25px;background:var(--tc);color:var(--ontc);display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;flex:none}
.vrs{display:none;padding:0 8px}
#vs.rs .vrs{display:block;animation:up .3s backwards}
#vs.rs .vph,#vs.rs .vtr{display:none}
.vlb{font-size:17px;font-weight:500;margin-top:26px}
.vlb.b{color:var(--pri)}
.vs1{font-size:40px;line-height:1.2;margin-top:34px;word-break:break-word}
.vs2{font-size:44px;line-height:1.2;margin-top:30px;color:var(--pri);word-break:break-word}
.vs2.er{font-size:22px;color:var(--err)}
.vact{display:flex;align-items:center;gap:4px;margin:14px -10px 0}
.vact .sp{flex:1}
.vact .ib{color:var(--ink)}
.vact.b .ib{color:var(--pri)}
.vline{height:2px;width:56%;margin:26px auto 0;background:var(--sel);border-radius:2px}
.vbot{flex:none;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:20px}
.vlg{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;width:100%}
.vlg .lb{opacity:.75;color:var(--mut);pointer-events:none}
.vlg .ar{display:grid;place-items:center;color:var(--mut)}
#vs.rs .vlg{display:none}
.vbig{width:100px;height:100px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;box-shadow:0 0 0 10px #0b57d022}
.vbig svg{width:38px;height:38px}
.vbig.rec{animation:pl 1.4s infinite}

/* ---- Text translate screen ---- */
#ts{position:absolute;top:0;left:0;right:0;bottom:0;z-index:8;display:none;flex-direction:column;background:var(--bot)}
#ts.on{display:flex;animation:fade .2s}
#ts .ttop{flex:1;min-height:0;background:var(--top);border-radius:0 0 32px 32px;display:flex;flex-direction:column;padding:10px 14px 0;overflow-y:auto}
#tIn{display:block;width:100%;flex:none;font-size:38px;line-height:1.2;height:60px;max-height:40vh;padding:0 8px;margin-top:26px;border:0;outline:0;background:transparent;color:var(--ink);resize:none}
#tIn::placeholder{color:var(--mut)}
#ts .paste{margin-left:8px}
.tres{display:none;padding:0 8px 40px}
#ts.rs .tres{display:block;animation:up .3s backwards}
#ts.rs .tedit,#ts.rs .tbot,#ts.rs #tHs{display:none}
#ts:not(.rs):not(.hw) #tCl,#ts:not(.rs) #tSt{display:none}
.tbot{flex:none;padding:16px 20px calc(10px + env(safe-area-inset-bottom,0px))}

/* ---- AI Translation settings ---- */
.aih{border-radius:28px;padding:22px 22px 20px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#0B57D0,#6B4EE6 60%,#8E5BFF);animation:up .4s backwards}
.aih h3{font-size:22px;font-weight:500;margin-bottom:6px}
.aih p{font-size:13.5px;opacity:.92;line-height:1.45}
.aih .cn{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:16px;background:#ffffff2e;font-size:13px;font-weight:500}
.ainote{font-size:13px;color:var(--mut);padding:2px 8px 12px;line-height:1.4}
.aic{background:var(--card);border-radius:24px;padding:14px 16px;margin-bottom:10px;animation:up .4s backwards;border:2px solid transparent;transition:border-color .2s}
.aic.on{border-color:var(--sel)}
.aib{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;border-radius:16px}
.aib:active{transform:scale(.99)}
.aii{width:44px;height:44px;border-radius:14px;background:var(--bot);color:var(--mut);display:grid;place-items:center;flex:none;transition:.2s}
.aic.on .aii{background:var(--tc);color:var(--ontc)}
.aix{flex:1;display:flex;flex-direction:column;min-width:0}
.aitt{font-size:16px;font-weight:500}
.aitag{font-style:normal;font-size:11px;font-weight:500;margin-left:6px;padding:2px 8px;border-radius:8px;background:var(--bot);color:var(--mut);vertical-align:middle}
.aid{font-size:13px;color:var(--mut);line-height:1.4;margin-top:3px}
.aist{align-self:flex-start;margin-top:8px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:10px;background:var(--bot);color:var(--mut)}
.aic.on .aist{background:var(--tc);color:var(--ontc)}
.seg{display:flex;background:var(--bot);border-radius:24px;padding:4px;margin-top:12px;transition:opacity .2s}
.seg.off{opacity:.55}
.seg button{flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:500;color:var(--mut)}
.seg button.a{background:var(--pri);color:var(--onpri)}
.aia{display:flex;gap:10px;margin:14px 0 10px}
.aia button{flex:1;height:52px;border-radius:26px;font-size:15px;font-weight:500}
.aia .sv{background:var(--pri);color:var(--onpri)}
.aia .sv.dirty{box-shadow:0 0 0 4px #0b57d033}
.aia .rs2{background:var(--tc);color:var(--ontc)}
.ldd{display:inline-flex;gap:7px;align-items:center;height:1.2em}
.ldd i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:ldd 1s ease-in-out infinite}
.ldd i:nth-child(2){animation-delay:.15s}.ldd i:nth-child(3){animation-delay:.3s}
@keyframes ldd{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.trm.fx{font-size:15px;color:var(--mut)}
.trm.fx b{color:var(--pri);font-weight:500}
.tex2{font-size:15px;line-height:1.5;padding:4px 0 14px;word-break:break-word}
.trm.fx svg{width:16px;height:16px;display:inline;vertical-align:-3px;margin-right:6px}
/* ---- Camera translate ---- */
#cam{position:absolute;inset:0;z-index:12;display:none;background:#000;overflow:hidden;color:#fff}
#cam.on{display:block;animation:fade .2s}
#camV{position:absolute;inset:0}
#camVid,#camImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#camImg{display:none;object-fit:contain}
#camO{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#cam.fz #camO{pointer-events:auto}
.cml{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:3px;line-height:1;white-space:nowrap;font-weight:500;cursor:pointer}
.cml span{display:inline-block}
.cml.s{outline:2px solid #4c8dff;box-shadow:0 0 0 3px #4c8dff77}
.camtop{position:absolute;top:0;left:0;right:0;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 36px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;background:linear-gradient(#000a,#0000);pointer-events:none}
.camtop .ib{color:#fff;pointer-events:auto}
.camtop h2{font-size:18px;font-weight:400;text-align:center}
#camP{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:0;right:0;margin:auto;width:fit-content;height:38px;padding:0 12px;border-radius:19px;background:#fffffff0;color:#1f1f1f;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}

.cpl{background:#C2E7FF;color:#004A77;border-radius:12px;padding:3px 10px}
#camD{position:absolute;top:calc(102px + env(safe-area-inset-top,0px));left:0;right:0;margin:auto;width:min(320px,92%);background:var(--bot);color:var(--ink);border-radius:24px;padding:14px;display:none;box-shadow:0 8px 28px #0006}

.camdl{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;gap:4px}
.camdl .lb{height:44px;font-size:14px}

.camh{background:#0009;border-radius:18px;padding:8px 16px;font-size:14px;max-width:100%;text-align:center}
.camrow{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;width:100%}
.camg{width:46px;height:46px;border-radius:12px;border:3px solid #fff;display:grid;place-items:center;color:#fff;justify-self:start}

/* ---- Handwriting input ---- */
#hw{display:none;flex:none;background:var(--bot)}

/* ---- History: flat list, swipe to delete ---- */
.hdy{font-size:12px;font-weight:500;color:var(--pri);padding:16px 8px 6px}
.hrow{position:relative;overflow:hidden;transition:height .2s ease}
.hbg{position:absolute;inset:0;background:#B3261E;display:flex;align-items:center;justify-content:flex-end;padding:0 24px}

.hfg .ht{flex:1;min-width:0}
.hfg .ha{font-size:15px;word-break:break-word}

.hst.on{color:var(--pri)}

#snk.on{opacity:1;transform:none}
/* ---- Tap to Translate ---- */
.tapil{border-radius:20px;overflow:hidden;margin:4px 0 16px;background:var(--ln)}
.tapil svg{display:block;width:100%;height:auto;fill:none}
.tapd{font-size:14px;line-height:1.45;padding:0 8px 14px}
.tapl .li.dis{opacity:.38;pointer-events:none}
@keyframes rip{0%{transform:scale(.8);opacity:.55}100%{transform:scale(1.35);opacity:0}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.8s ease-out infinite}
#fab{position:absolute;z-index:6;right:16px;bottom:210px;width:54px;height:54px;border-radius:50%;background:var(--card);color:var(--pri);display:none;place-items:center;box-shadow:0 2px 10px #0004;touch-action:none}
#fab.on{display:grid}
#fab.snap{transition:left .12s ease-out,top .12s ease-out,transform .12s}
#fab.go{transition:transform .2s,opacity .2s;transform:scale(.2);opacity:0}
#fabX{position:absolute;z-index:7;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:64px;height:64px;margin-left:-32px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;opacity:0;transform:translateY(30px) scale(.6);pointer-events:none;transition:opacity .18s,transform .18s}
#fabX.on{opacity:.9;transform:none}
#fabX.hot{opacity:1;transform:scale(1.3)}
#fabX svg{width:28px;height:28px}
#fab svg{width:26px;height:26px}
/* ---- swipe hint on home ---- */
#home .top{position:relative;z-index:1;transition:margin-bottom .22s ease}
#home .bot{position:relative}
#home .bot::after{content:"";position:absolute;inset:0;background:#0000002e;opacity:0;pointer-events:none;transition:opacity .22s}
#hintT{display:none;font-size:38px;line-height:1.25;color:var(--mut);margin-top:56px;padding:0 4px;animation:up .25s backwards}
#home.hint .inw,#home.hint #pasteB,#home.hint .res{display:none!important}
#home.hint #hintT{display:block}
#home.hint .top{margin-bottom:-56px}
#home.hint .bot::after{opacity:1}
#home.hint .hdl{background:#9BC5A8}

/* ---- Voice picker ---- */
.vr .aii{width:40px;height:40px;border-radius:50%}
.vr.s{background:var(--sel);color:var(--ontc)}

.vpn{font-size:13px;color:var(--mut);padding:2px 8px 12px;line-height:1.4}
</style>

function lvModeUI(){var c=lv.mode==="conv";
 $("lvFt").innerHTML=ic(c?"sp":"vof")+"Their language";$("lvTt").innerHTML=ic(c?"sp":"vof")+"Your language";
 $("lvIl").innerHTML=lvIll(c);
 $("lvO").innerHTML=lvCard("none","head","Listening","Connect headphones to hear real-time translations",0,1)+lvCard("conv","sp","Conversation","Take turns speaking. Translations will play out loud.",c)+lvCard("text","art","Text only","Read translations on your phone. Nothing will be played out loud.",!c);
 $("lvO").querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){lvSetMode(b.dataset.m)}});
 $("lvMd").innerHTML=ic(c?"sp":"art")+(c?"Conversation":"Text only")}
function lvSetMode(m){if(m!=="conv"&&m!=="text")return;lv.mode=m;if(m==="text"){vcStop()}lvModeUI()}
function lvLab(){$("lvF").textContent=L[from];$("lvT").textContent=L[to];$("lvPf").textContent=L[from];$("lvPt").textContent=L[to]}
function lvPills(){$("lvPf").classList.toggle("a",lv.cur==="f");$("lvPt").classList.toggle("a",lv.cur==="t")}

function lvRender(){var ls=$("lvLs"),h=lv.en.map(function(e,i){
  return '<div class="lve'+(e.c?' c':'')+'"><div class="lvh2"><span>'+L[e.f]+'</span>'+ic("arr")+'<span class="sp">'+L[e.g]+'</span><button class="ib" data-sp="'+i+'">'+ic("vol")+'</button><button class="ib cv" data-cv="'+i+'">'+ic("more")+'</button></div><div class="lvs1 ln">'+lvEsc(e.s)+'</div><div class="lvs2">'+lvEsc(e.o)+'</div></div>'}).join("");
 if(lv.int){var fi=lv.cur==="f"?from:to,gi=lv.cur==="f"?to:from;h+='<div class="lve"><div class="lvh2"><span>'+L[fi]+'</span>'+ic("arr")+'<span class="sp">'+L[gi]+'</span></div><div class="lvs1'+(lv.out?' ln':'')+'">'+lvEsc(lv.int)+'</div>'+(lv.out?'<div class="lvs2">'+lvEsc(lv.out)+'</div>':'')+'</div>'}
 ls.innerHTML=h;ls.scrollTop=ls.scrollHeight}
$("lvLs").onclick=function(e){var a=e.target.closest("[data-sp]"),b=e.target.closest("[data-cv]");
 if(b){var x=lv.en[+b.dataset.cv];x.c=!x.c;lvRender();return}
 if(a){lv.tk++;lv.busy=false;var x=lv.en[+a.dataset.sp],tk=lv.tk;lvStop();lv.sp=1;lvSt("Speaking\u2026");lvSay(x.o,x.g,function(){if(tk!==lv.tk)return;lv.sp=Math.max(0,lv.sp-1);if(lv.on){lvSt("Listening\u2026");lvListen()}})}};

function lvSayDev(t,gi,cb){var done=false,tmo;function fin(){if(done)return;done=true;clearTimeout(tmo);cb&&cb()}
 try{if(!window.speechSynthesis){fin();return}
  speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=lvLoc(gi);u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
  tmo=setTimeout(fin,Math.max(4000,t.length*150+3000))}catch(e){fin()}}
function lvX(t,fi,gi){return xlm(t,fi,gi).then(function(r){return r.o})}
function lvListen(){if(!lv.on||lv.busy||lv.sp>0||lv.rec)return;
 if(!SR){lvSt("Voice input isn't supported in this browser");return}
 var r=new SR(),gi=lv.cur==="f"?from:to,fin="",itm="";r.lang=lvLoc(gi);r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
 r.onstart=function(){if(lv.rec===r)lvSt("Listening\u2026")};
 r.onresult=function(e){if(lv.rec!==r)return;var t="",f=false;for(var i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)f=true}lv.int=t;itm=t;if(f)fin=t;lvRender();lvSilence(r);if(!f)lvSpecSched(t,gi,gi===from?to:from)};
 r.onerror=function(e){if(lv.rec!==r)return;

function vcGet(t,v){var k=v.id+"|"+t;if(vc.cache.has(k))return vc.cache.get(k);
 var p=fetch("https://gen.pollinations.ai/audio/"+encodeURIComponent(t)+"?voice="+encodeURIComponent(v.v)+"&model="+v.m,{headers:{"Authorization":"Bearer "+PK}})
 .then(function(r){if(!r.ok)throw 0;return r.blob()})
 .then(function(b){if(!b.size||(b.type&&!/audio|octet/i.test(b.type)))throw 0;return URL.createObjectURL(b)});
 vc.cache.set(k,p);p.catch(function(){vc.cache.delete(k)});
 if(vc.cache.size>40)vc.cache.delete(vc.cache.keys().next().value);return p}

   function(){if(tk!==vc.tk)return;vcWarn();return new Promise(function(res){lvSay1Dev(p,gi,res)})})})
  .then(function(){if(k===parts.length-1&&tk===vc.tk&&cb)cb()})})}

/* ===== Home swipe: up = hint, down = history ===== */
(function(){var h=$("home"),tp0=h.querySelector(".top"),sx=0,sy=0,st=0,on=false,moved=false;
 function hintOff(){h.classList.remove("hint")}
 window.homeHintOff=hintOff;
 function start(x,y){on=true;moved=false;sx=x;sy=y;st=tp0.scrollTop}
 function finish(x,y){if(!on)return;on=false;var dx=x-sx,dy=y-sy;if(Math.abs(dy)<55||Math.abs(dx)>Math.abs(dy)*.8)return;moved=true;
  if(dy>0){if(st<=0){hintOff();show("history")}}
  else{if(st<=0||tp0.scrollHeight<=tp0.clientHeight+2)h.classList.add("hint")}}
 h.addEventListener("touchstart",function(e){var t=e.touches[0];start(t.clientX,t.clientY)},{passive:true});
 h.addEventListener("touchend",function(e){var t=e.changedTouches[0];finish(t.clientX,t.clientY)},{passive:true});
 h.addEventListener("touchcancel",function(){on=false},{passive:true});
 h.addEventListener("mousedown",function(e){start(e.clientX,e.clientY)});
 window.addEventListener("mouseup",function(e){if(on)finish(e.clientX,e.clientY)});
 h.addEventListener("click",function(e){if(moved){moved=false;e.stopPropagation();e.preventDefault();return}
  if(h.classList.contains("hint")){hintOff();e.stopPropagation();e.preventDefault()}},true);
 })();
